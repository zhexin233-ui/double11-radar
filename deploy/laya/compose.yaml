name: laya
services:
  laya:
    image: local/laya:0.4.15-cpu
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
    user: "${LAYA_UID:-1000}:${LAYA_GID:-1000}"
    init: true
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 6g
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      USER: laya
      HOME: /cache
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "8000"
      LAYA_DEVICE: cpu
      LAYA_MODELS: multilingual
      LAYA_DEFAULT_MODEL: multilingual
      LAYA_PRELOAD: "1"
      LAYA_MAX_LOADED: "1"
      LAYA_THREADS: "4"
      OMP_NUM_THREADS: "4"
      LAYA_MAX_CONCURRENT: "1"
      LAYA_AUTO_TASK: "0"
      LAYA_JEV_STRICT: "1"
      LAYA_REVISION: "7b928d828b7b0e022f929d9bd2e44165aa270148"
      LAYA_API_KEY_FILE: /run/secrets/laya_api_key
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./cache:/cache
      - ./secrets/api_key:/run/secrets/laya_api_key:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
